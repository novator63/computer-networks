[General]
network = Global
sim-time-limit = 100s

# ============================================================
# IPv4 configurator
# ============================================================

*.configurator.assignDisjunctSubnetAddresses = true

# Роутинг на OSPF-роутерах строит OSPF.
# Конечным хостам нужны маршруты до шлюза.
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true
*.configurator.addDirectRoutes = true
*.configurator.optimizeRoutes = true

# После обрыва маршруты должен перестраивать OSPF, а не конфигуратор.
*.configurator.updateRoutes = false

# Статические маршруты строим только от обычных хостов.
*.configurator.config = xml("<config>\
    <interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/>\
    <autoroute sourceHosts='Global.branch*.office*.client[*] Global.branch*.localServer[*]' destinationInterfaces='**' metric='hopCount'/>\
</config>")

*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true

# ============================================================
# OSPF
# ============================================================

**.ospf.ospfConfig = xmldoc("ospf_config.xml")

# Быстрая сходимость после обрыва
**.ospf.helloInterval = 1s
**.ospf.deadInterval = 4s
**.ospf.retransmissionInterval = 1s

# ============================================================
# Transport
# ============================================================

**.hasUdp = true
**.hasTcp = true

# ============================================================
# Checksums / CRC
# ============================================================

**.crcMode = "computed"
**.fcsMode = "computed"
**.checksumMode = "computed"

# ============================================================
# IP forwarding
# ============================================================

**.forwarding = true
**.ipv4.forwarding = true

# ============================================================
# Приложения по умолчанию выключены
# ============================================================

**.client[*].numApps = 0
**.localServer[*].numApps = 0
*.extServer1.numApps = 0
*.extServer2.numApps = 0

# ============================================================
# Статистика
# ============================================================

**.scalar-recording = true
**.vector-recording = true

# ============================================================
# DMZ / ACL
# ============================================================

*.extServer*.acl.config = xmldoc("acl_config.xml")


[Config CleanUDP_OSPF]
description = "Clean baseline: OSPF, UDP/5000 traffic only, no failures, no forbidden traffic"

*.branch*.office1Clients = 4
*.branch*.office2Clients = 4
*.branch*.office3Clients = 4
*.branch*.office4Clients = 3
*.branch*.numLocalServers = 1

*.extServer1.numApps = 1
*.extServer1.app[0].typename = "UdpEchoApp"
*.extServer1.app[0].localPort = 5000

*.extServer2.numApps = 1
*.extServer2.app[0].typename = "UdpEchoApp"
*.extServer2.app[0].localPort = 5000

# Внутренний сервер документооборота в каждом филиале.
*.branch*.localServer[0].numApps = 1
*.branch*.localServer[0].app[0].typename = "UdpEchoApp"
*.branch*.localServer[0].app[0].localPort = 6000

*.branch*.office*.client[*].numApps = 3

*.branch*.office*.client[*].app[0].typename = "UdpBasicApp"
*.branch*.office*.client[*].app[0].destAddresses = "extServer1"
*.branch*.office*.client[*].app[0].destPort = 5000
*.branch*.office*.client[*].app[0].messageLength = 1100B
*.branch*.office*.client[*].app[0].sendInterval = 1s
*.branch*.office*.client[*].app[0].startTime = uniform(10s, 12s)
*.branch*.office*.client[*].app[0].stopTime = 95s

*.branch*.office*.client[*].app[1].typename = "UdpBasicApp"
*.branch*.office*.client[*].app[1].destAddresses = "extServer2"
*.branch*.office*.client[*].app[1].destPort = 5000
*.branch*.office*.client[*].app[1].messageLength = 1100B
*.branch*.office*.client[*].app[1].sendInterval = 1s
*.branch*.office*.client[*].app[1].startTime = uniform(10.5s, 12.5s)
*.branch*.office*.client[*].app[1].stopTime = 95s

# app[2] -> локальный сервер документооборота своего филиала
*.branch*.office*.client[*].app[2].typename = "UdpBasicApp"
*.branch*.office*.client[*].app[2].destPort = 6000
*.branch*.office*.client[*].app[2].messageLength = 1100B
*.branch*.office*.client[*].app[2].sendInterval = 1s
*.branch*.office*.client[*].app[2].startTime = uniform(9s, 11s)
*.branch*.office*.client[*].app[2].stopTime = 95s
*.branch1.office*.client[*].app[2].destAddresses = "Global.branch1.localServer[0]"
*.branch2.office*.client[*].app[2].destAddresses = "Global.branch2.localServer[0]"
*.branch3.office*.client[*].app[2].destAddresses = "Global.branch3.localServer[0]"


[Config CleanTCP_OSPF]
description = "Clean baseline: OSPF, TCP/5000 traffic only, no failures, no forbidden traffic"

*.branch*.office1Clients = 4
*.branch*.office2Clients = 4
*.branch*.office3Clients = 4
*.branch*.office4Clients = 3
*.branch*.numLocalServers = 1

*.extServer1.numApps = 1
*.extServer1.app[0].typename = "TcpGenericServerApp"
*.extServer1.app[0].localPort = 5000
*.extServer1.app[0].replyDelay = 0.01s

*.extServer2.numApps = 1
*.extServer2.app[0].typename = "TcpGenericServerApp"
*.extServer2.app[0].localPort = 5000
*.extServer2.app[0].replyDelay = 0.01s

# Внутренний сервер документооборота в каждом филиале.
*.branch*.localServer[0].numApps = 1
*.branch*.localServer[0].app[0].typename = "TcpGenericServerApp"
*.branch*.localServer[0].app[0].localPort = 6000
*.branch*.localServer[0].app[0].replyDelay = 0.01s

*.branch*.office*.client[*].numApps = 3

*.branch*.office*.client[*].app[0].typename = "TcpBasicClientApp"
*.branch*.office*.client[*].app[0].connectAddress = "extServer1"
*.branch*.office*.client[*].app[0].connectPort = 5000
*.branch*.office*.client[*].app[0].requestLength = 1100B
*.branch*.office*.client[*].app[0].replyLength = 1100B
*.branch*.office*.client[*].app[0].numRequestsPerSession = 1
*.branch*.office*.client[*].app[0].thinkTime = 0s
*.branch*.office*.client[*].app[0].idleInterval = 1s
*.branch*.office*.client[*].app[0].reconnectInterval = 2s
*.branch*.office*.client[*].app[0].startTime = uniform(10s, 12s)
*.branch*.office*.client[*].app[0].stopTime = 95s

*.branch*.office*.client[*].app[1].typename = "TcpBasicClientApp"
*.branch*.office*.client[*].app[1].connectAddress = "extServer2"
*.branch*.office*.client[*].app[1].connectPort = 5000
*.branch*.office*.client[*].app[1].requestLength = 1100B
*.branch*.office*.client[*].app[1].replyLength = 1100B
*.branch*.office*.client[*].app[1].numRequestsPerSession = 1
*.branch*.office*.client[*].app[1].thinkTime = 0s
*.branch*.office*.client[*].app[1].idleInterval = 1s
*.branch*.office*.client[*].app[1].reconnectInterval = 2s
*.branch*.office*.client[*].app[1].startTime = uniform(10.5s, 12.5s)
*.branch*.office*.client[*].app[1].stopTime = 95s

# app[2] TCP к локальному серверу документооборота своего филиала
*.branch*.office*.client[*].app[2].typename = "TcpBasicClientApp"
*.branch*.office*.client[*].app[2].connectPort = 6000
*.branch*.office*.client[*].app[2].requestLength = 1100B
*.branch*.office*.client[*].app[2].replyLength = 1100B
*.branch*.office*.client[*].app[2].numRequestsPerSession = 1
*.branch*.office*.client[*].app[2].thinkTime = 0s
*.branch*.office*.client[*].app[2].idleInterval = 1s
*.branch*.office*.client[*].app[2].reconnectInterval = 2s
*.branch*.office*.client[*].app[2].startTime = uniform(9s, 11s)
*.branch*.office*.client[*].app[2].stopTime = 95s
*.branch1.office*.client[*].app[2].connectAddress = "Global.branch1.localServer[0]"
*.branch2.office*.client[*].app[2].connectAddress = "Global.branch2.localServer[0]"
*.branch3.office*.client[*].app[2].connectAddress = "Global.branch3.localServer[0]"


[Config FailoverUDP_OSPF]
extends = CleanUDP_OSPF
description = "Failover: OSPF, UDP/5000 traffic, cable breaks at 30s and 55s, no forbidden traffic"

# Для наглядности failover-сценарий оставлен как раньше: только внешние серверы.
*.branch*.localServer[0].numApps = 0
*.branch*.office*.client[*].numApps = 2

*.scenarioManager.script = xml("<scenario>\
    <disconnect t='30s' src-module='branch1' dest-module='core'/>\
    <disconnect t='55s' src-module='core' dest-module='extServer1'/>\
</scenario>")


[Config FailoverTCP_OSPF]
extends = CleanTCP_OSPF
description = "Failover: OSPF, TCP/5000 traffic, cable breaks at 30s and 55s, no forbidden traffic"

# Для наглядности failover-сценарий оставлен как раньше: только внешние серверы.
*.branch*.localServer[0].numApps = 0
*.branch*.office*.client[*].numApps = 2

*.scenarioManager.script = xml("<scenario>\
    <disconnect t='30s' src-module='branch1' dest-module='core'/>\
    <disconnect t='55s' src-module='core' dest-module='extServer1'/>\
</scenario>")


[Config SecurityDemo_OSPF]
description = "Security demo: branch1 office1 attempts allowed TCP/UDP 5000 and forbidden TCP/UDP 9999, no failures"

*.branch*.office1Clients = 4
*.branch*.office2Clients = 4
*.branch*.office3Clients = 4
*.branch*.office4Clients = 3
*.branch*.numLocalServers = 1

# DMZ servers expose only the required services on port 5000.
*.extServer1.numApps = 2
*.extServer1.app[0].typename = "UdpEchoApp"
*.extServer1.app[0].localPort = 5000
*.extServer1.app[1].typename = "TcpGenericServerApp"
*.extServer1.app[1].localPort = 5000
*.extServer1.app[1].replyDelay = 0.01s

*.extServer2.numApps = 2
*.extServer2.app[0].typename = "UdpEchoApp"
*.extServer2.app[0].localPort = 5000
*.extServer2.app[1].typename = "TcpGenericServerApp"
*.extServer2.app[1].localPort = 5000
*.extServer2.app[1].replyDelay = 0.01s

# Только office1 филиала branch1 имитирует атаку.
*.branch1.office1.client[*].numApps = 4

# Разрешенный UDP/5000 поток.
*.branch1.office1.client[*].app[0].typename = "UdpBasicApp"
*.branch1.office1.client[*].app[0].destAddresses = "extServer1"
*.branch1.office1.client[*].app[0].destPort = 5000
*.branch1.office1.client[*].app[0].messageLength = 1100B
*.branch1.office1.client[*].app[0].sendInterval = 1s
*.branch1.office1.client[*].app[0].startTime = uniform(10s, 12s)
*.branch1.office1.client[*].app[0].stopTime = 40s

# Разрешенный TCP/5000 поток.
*.branch1.office1.client[*].app[1].typename = "TcpBasicClientApp"
*.branch1.office1.client[*].app[1].connectAddress = "extServer2"
*.branch1.office1.client[*].app[1].connectPort = 5000
*.branch1.office1.client[*].app[1].requestLength = 1100B
*.branch1.office1.client[*].app[1].replyLength = 1100B
*.branch1.office1.client[*].app[1].numRequestsPerSession = 1
*.branch1.office1.client[*].app[1].thinkTime = 0s
*.branch1.office1.client[*].app[1].idleInterval = 1s
*.branch1.office1.client[*].app[1].reconnectInterval = 2s
*.branch1.office1.client[*].app[1].startTime = uniform(10.5s, 12.5s)
*.branch1.office1.client[*].app[1].stopTime = 40s

# Запрещенный UDP/9999 поток.
*.branch1.office1.client[*].app[2].typename = "UdpBasicApp"
*.branch1.office1.client[*].app[2].destAddresses = "extServer1"
*.branch1.office1.client[*].app[2].destPort = 9999
*.branch1.office1.client[*].app[2].messageLength = 1100B
*.branch1.office1.client[*].app[2].sendInterval = 1s
*.branch1.office1.client[*].app[2].startTime = uniform(14s, 16s)
*.branch1.office1.client[*].app[2].stopTime = 40s

# Запрещенный TCP/9999 поток. Окно короткое, чтобы демонстрация не тратила время на долгие reconnect.
*.branch1.office1.client[*].app[3].typename = "TcpBasicClientApp"
*.branch1.office1.client[*].app[3].connectAddress = "extServer2"
*.branch1.office1.client[*].app[3].connectPort = 9999
*.branch1.office1.client[*].app[3].requestLength = 1100B
*.branch1.office1.client[*].app[3].replyLength = 1100B
*.branch1.office1.client[*].app[3].numRequestsPerSession = 1
*.branch1.office1.client[*].app[3].thinkTime = 0s
*.branch1.office1.client[*].app[3].idleInterval = 1s
*.branch1.office1.client[*].app[3].reconnectInterval = 2s
*.branch1.office1.client[*].app[3].startTime = uniform(14.5s, 16.5s)
*.branch1.office1.client[*].app[3].stopTime = 25s
