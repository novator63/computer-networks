*.branch2.office2.client[*].app[2].connectAddress = "Global.branch2.localServer[1]"
*.branch2.office3.client[*].app[2].connectAddress = "Global.branch2.localServer[2]"
*.branch2.office4.client[*].app[2].connectAddress = "Global.branch2.localServer[2]"

*.branch3.office1.client[*].app[2].connectAddress = "Global.branch3.localServer[0]"
*.branch3.office2.client[*].app[2].connectAddress = "Global.branch3.localServer[1]"
*.branch3.office3.client[*].app[2].connectAddress = "Global.branch3.localServer[2]"
*.branch3.office4.client[*].app[2].connectAddress = "Global.branch3.localServer[2]"


[Config FailoverTCP_OSPF]
extends = CleanTCP_OSPF
description = "Failover: OSPF, TCP/5000 traffic, cable breaks at 30s and 55s, no forbidden traffic"

# Для наглядности failover-сценарий оставлен как раньше: только внешние серверы.
*.branch*.localServer[0].numApps = 0
*.branch*.office*.client[*].numApps = 2

*.scenarioManager.script = xml("<scenario>\
    <disconnect t='30s' src-module='branch1' dest-module='core'/>\
    <disconnect t='55s' src-module='core' dest-module='extServer1'/>\
</scenario>")


[Config SecurityDemo_OSPF]
description = "Security demo: branch1 office1 attempts allowed TCP/UDP 5000 and forbidden TCP/UDP 9999, no failures"

*.branch*.office1Clients = 4
*.branch*.office2Clients = 4
*.branch*.office3Clients = 4
*.branch*.office4Clients = 3
*.branch*.numLocalServers = 1

# DMZ servers expose only the required services on port 5000.
*.extServer1.numApps = 2
*.extServer1.app[0].typename = "UdpEchoApp"
*.extServer1.app[0].localPort = 5000
*.extServer1.app[1].typename = "TcpGenericServerApp"
*.extServer1.app[1].localPort = 5000
*.extServer1.app[1].replyDelay = 0.01s

*.extServer2.numApps = 2
*.extServer2.app[0].typename = "UdpEchoApp"
*.extServer2.app[0].localPort = 5000
*.extServer2.app[1].typename = "TcpGenericServerApp"
*.extServer2.app[1].localPort = 5000
*.extServer2.app[1].replyDelay = 0.01s

# Только office1 филиала branch1 имитирует атаку.
*.branch1.office1.client[*].numApps = 4

# Разрешенный UDP/5000 поток.
*.branch1.office1.client[*].app[0].typename = "UdpBasicApp"
*.branch1.office1.client[*].app[0].destAddresses = "extServer1"
*.branch1.office1.client[*].app[0].destPort = 5000
*.branch1.office1.client[*].app[0].messageLength = 1100B
*.branch1.office1.client[*].app[0].sendInterval = 1s
*.branch1.office1.client[*].app[0].startTime = uniform(10s, 12s)
*.branch1.office1.client[*].app[0].stopTime = 40s

# Разрешенный TCP/5000 поток.
*.branch1.office1.client[*].app[1].typename = "TcpBasicClientApp"
*.branch1.office1.client[*].app[1].connectAddress = "extServer2"
*.branch1.office1.client[*].app[1].connectPort = 5000
*.branch1.office1.client[*].app[1].requestLength = 1100B
*.branch1.office1.client[*].app[1].replyLength = 1100B
*.branch1.office1.client[*].app[1].numRequestsPerSession = 1
*.branch1.office1.client[*].app[1].thinkTime = 0s
*.branch1.office1.client[*].app[1].idleInterval = 1s
*.branch1.office1.client[*].app[1].reconnectInterval = 2s
*.branch1.office1.client[*].app[1].startTime = uniform(10.5s, 12.5s)
*.branch1.office1.client[*].app[1].stopTime = 40s

# Запрещенный UDP/9999 поток.
*.branch1.office1.client[*].app[2].typename = "UdpBasicApp"
*.branch1.office1.client[*].app[2].destAddresses = "extServer1"
*.branch1.office1.client[*].app[2].destPort = 9999
*.branch1.office1.client[*].app[2].messageLength = 1100B
*.branch1.office1.client[*].app[2].sendInterval = 1s
*.branch1.office1.client[*].app[2].startTime = uniform(14s, 16s)
*.branch1.office1.client[*].app[2].stopTime = 40s

# Запрещенный TCP/9999 поток. Окно короткое, чтобы демонстрация не тратила время на долгие reconnect.
*.branch1.office1.client[*].app[3].typename = "TcpBasicClientApp"
*.branch1.office1.client[*].app[3].connectAddress = "extServer2"
*.branch1.office1.client[*].app[3].connectPort = 9999
*.branch1.office1.client[*].app[3].requestLength = 1100B
*.branch1.office1.client[*].app[3].replyLength = 1100B
*.branch1.office1.client[*].app[3].numRequestsPerSession = 1
*.branch1.office1.client[*].app[3].thinkTime = 0s
*.branch1.office1.client[*].app[3].idleInterval = 1s
*.branch1.office1.client[*].app[3].reconnectInterval = 2s
*.branch1.office1.client[*].app[3].startTime = uniform(14.5s, 16.5s)
*.branch1.office1.client[*].app[3].stopTime = 25s


[Config PcapBase]
abstract = true
description = "Base selected PCAP recording settings"

# Global.ned PPP interface map:
# core.ppp[0] <-> branch1.router.ppp[0]
# core.ppp[1] <-> branch2.router.ppp[0]
# core.ppp[2] <-> branch3.router.ppp[0]
# core.ppp[3] <-> extServer1.ppp[0]
# branch3.router.ppp[1] <-> extServer2.ppp[0]
# branch1.router.ppp[1] <-> branch2.router.ppp[1]
# branch2.router.ppp[2] <-> branch3.router.ppp[2]
# branch3.router.ppp[3] <-> branch1.router.ppp[2]

**.pcapRecorder[*].alwaysFlush = true
**.pcapRecorder[*].verbose = false

*.core.numPcapRecorders = 4
*.core.pcapRecorder[0].moduleNamePatterns = "ppp[0]"
*.core.pcapRecorder[0].pcapFile = "${resultdir}/pcap/${configname}-core-ppp0-branch1.pcap"
