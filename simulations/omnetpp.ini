[General]
network = Global
sim-time-limit = 10s

# для корректных расчётов
**.crcMode = "computed"
**.fcsMode = "computed"
**.checksumMode = "computed"

# адресация и маршруты
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true

# облако
**.internet.ipv4Delayer.config = xmldoc("internetCloud.xml")

# по умолчанию: 1 локальный сервер в филиале
**.numLocalServers = 1

# приложения
**.branch*.office*.client[*].numApps = 1
**.branch*.localServer[*].numApps = 1
*.extServer.numApps = 1

# внешний сервер
*.extServer.app[0].typename = "TcpEchoApp"
*.extServer.app[0].localPort = 1000
*.extServer.app[0].echoDelay = 0s

# локальные серверы
**.branch*.localServer[*].app[0].typename = "TcpEchoApp"
**.branch*.localServer[*].app[0].localPort = 1000
**.branch*.localServer[*].app[0].echoDelay = 0s

# общие настройки клиентов
**.branch*.office*.client[*].app[0].typename = "TcpSessionApp"
**.branch*.office*.client[*].app[0].active = true
**.branch*.office*.client[*].app[0].localPort = -1
**.branch*.office*.client[*].app[0].connectPort = 1000
**.branch*.office*.client[*].app[0].tOpen = uniform(0.1s, 1s)
**.branch*.office*.client[*].app[0].tSend = 1s
**.branch*.office*.client[*].app[0].sendBytes = 1100B
**.branch*.office*.client[*].app[0].tClose = 9s

# локальный трафик: office1 и office2
**.branch1.office1.client[*].app[0].connectAddress = "branch1.localServer[0]"
**.branch1.office2.client[*].app[0].connectAddress = "branch1.localServer[0]"
**.branch2.office1.client[*].app[0].connectAddress = "branch2.localServer[0]"
**.branch2.office2.client[*].app[0].connectAddress = "branch2.localServer[0]"
**.branch3.office1.client[*].app[0].connectAddress = "branch3.localServer[0]"
**.branch3.office2.client[*].app[0].connectAddress = "branch3.localServer[0]"

# внешний трафик: office3 и office4
**.branch*.office3.client[*].app[0].connectAddress = "extServer"
**.branch*.office4.client[*].app[0].connectAddress = "extServer"

[Config Servers2]
description = "В каждом филиале 2 локальных сервера"
**.numLocalServers = 2

# распределяем локальных клиентов между 2 серверами
**.branch1.office1.client[*].app[0].connectAddress = "branch1.localServer[0]"
**.branch1.office2.client[*].app[0].connectAddress = "branch1.localServer[1]"
**.branch2.office1.client[*].app[0].connectAddress = "branch2.localServer[0]"
**.branch2.office2.client[*].app[0].connectAddress = "branch2.localServer[1]"
**.branch3.office1.client[*].app[0].connectAddress = "branch3.localServer[0]"
**.branch3.office2.client[*].app[0].connectAddress = "branch3.localServer[1]"

[Config Servers3]
description = "В каждом филиале 3 локальных сервера"
**.numLocalServers = 3

# распределяем локальных клиентов между 3 серверами
**.branch1.office1.client[*].app[0].connectAddress = "branch1.localServer[0]"
**.branch1.office2.client[*].app[0].connectAddress = "branch1.localServer[1]"
**.branch1.office3.client[*].app[0].connectAddress = "branch1.localServer[2]"

**.branch2.office1.client[*].app[0].connectAddress = "branch2.localServer[0]"
**.branch2.office2.client[*].app[0].connectAddress = "branch2.localServer[1]"
**.branch2.office3.client[*].app[0].connectAddress = "branch2.localServer[2]"

**.branch3.office1.client[*].app[0].connectAddress = "branch3.localServer[0]"
**.branch3.office2.client[*].app[0].connectAddress = "branch3.localServer[1]"
**.branch3.office3.client[*].app[0].connectAddress = "branch3.localServer[2]"

# office4 остаётся внешним
**.branch*.office4.client[*].app[0].connectAddress = "extServer"

[Config Scale16]
description = "Масштабируемость: 16 рабочих мест"
**.numLocalServers = 1
**.office4Clients = 4