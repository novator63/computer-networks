[General]
network = Global
sim-time-limit = 100s

# ============================================================
# IPv4 configurator
# ============================================================

*.configurator.assignDisjunctSubnetAddresses = true

*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true
*.configurator.addDirectRoutes = true
*.configurator.optimizeRoutes = true
*.configurator.updateRoutes = true

*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true

# ============================================================
# OSPF пока отключён
# ============================================================

**.router.hasOspf = false
*.core.hasOspf = false

# ============================================================
# Checksums / CRC
# ============================================================

**.crcMode = "computed"
**.fcsMode = "computed"
**.checksumMode = "computed"

# ============================================================
# IP forwarding
# ============================================================

**.router.ipv4.forwarding = true
*.core.ipv4.forwarding = true

# ============================================================
# Все приложения по умолчанию выключены
# ============================================================

**.client[*].numApps = 0
**.localServer[*].numApps = 0
*.extServer.numApps = 0


[Config FailoverUDP]
description = "UDP failover after one cable break"

# ============================================================
# Обрыв прямого канала branch1 -> core на 30 секунде
# ============================================================

*.scenarioManager.script = xml("<scenario>\
    <at t='30s'>\
        <disconnect src-module='branch1' src-gate='pppg[0]'/>\
    </at>\
</scenario>")

# ============================================================
# UDP сервер
# ============================================================

*.extServer.numApps = 1
*.extServer.app[0].typename = "UdpSink"
*.extServer.app[0].localPort = 5000

# ============================================================
# UDP клиенты: все филиалы, все офисы
# ============================================================

*.branch*.office*.client[*].numApps = 1
*.branch*.office*.client[*].app[0].sendInterval = 1s
*.branch*.office*.client[*].app[0].typename = "UdpBasicApp"
*.branch*.office*.client[*].app[0].destAddresses = "extServer"
*.branch*.office*.client[*].app[0].destPort = 5000
*.branch*.office*.client[*].app[0].messageLength = 1000B
*.branch*.office*.client[*].app[0].sendInterval = 0.2s
*.branch*.office*.client[*].app[0].startTime = uniform(5s, 7s)
*.branch*.office*.client[*].app[0].stopTime = 95s