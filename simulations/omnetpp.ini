[General]
network = Global
sim-time-limit = 100s

# ============================================================
# IPv4 configurator
# ============================================================

*.configurator.assignDisjunctSubnetAddresses = true

# Статические маршруты + пересчёт после обрыва.
# Это простой рабочий вариант для демонстрации отказоустойчивости.
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true
*.configurator.addDirectRoutes = true
*.configurator.optimizeRoutes = true
*.configurator.updateRoutes = true

# Для проверки адресов и маршрутов в консоли
*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true

# ============================================================
# OSPF пока отключаем
# ============================================================
# Текущая цель — стабильный рабочий failover по ТЗ.
# OSPF можно вернуть позже, когда базовая схема уже доказана.

**.router.hasOspf = false
*.core.hasOspf = false

# ============================================================
# Checksums / CRC
# ============================================================

**.crcMode = "computed"
**.fcsMode = "computed"
**.checksumMode = "computed"

# ============================================================
# IP forwarding
# ============================================================

**.router.ipv4.forwarding = true
*.core.ipv4.forwarding = true

# ============================================================
# Приложения по умолчанию выключены
# ============================================================

**.client[*].numApps = 0
**.localServer[*].numApps = 0
*.extServer.numApps = 0

# ============================================================
# Запись статистики
# ============================================================

**.scalar-recording = true
**.vector-recording = true


[Config FailoverUDP_TZ]
description = "TZ: 3 branches, 4 offices, 15 clients, UDP echo traffic, one cable break"

# ============================================================
# Параметры филиалов по ТЗ
# ============================================================
# 15 рабочих мест на ЛВС:
# office1 = 4
# office2 = 4
# office3 = 4
# office4 = 3
# Итого: 15 клиентов в каждом филиале.

*.branch*.office1Clients = 4
*.branch*.office2Clients = 4
*.branch*.office3Clients = 4
*.branch*.office4Clients = 3

# 1 локальный сервер в каждом филиале
*.branch*.numLocalServers = 1

# ============================================================
# Обрыв одного кабеля на 30 секунде
# ============================================================
# Рвём прямой канал branch1 -> core.
# После этого branch1 должен идти к core через branch2/branch3.

*.scenarioManager.script = xml("<scenario>\
    <at t='30s'>\
        <disconnect src-module='branch1' src-gate='pppg[0]'/>\
    </at>\
</scenario>")

# ============================================================
# Внешний сервер: UDP Echo
# ============================================================
# UdpEchoApp принимает пакет и отправляет ответ обратно клиенту.
# Это нужно для проверки времени отклика.

*.extServer.numApps = 1
*.extServer.app[0].typename = "UdpEchoApp"
*.extServer.app[0].localPort = 5000

# ============================================================
# UDP клиенты: все филиалы, все офисы, все рабочие места
# ============================================================
# По ТЗ пакет 1100 байт.
# Клиенты отправляют запросы на внешний сервер и получают ответы.

*.branch*.office*.client[*].numApps = 1
*.branch*.office*.client[*].app[0].typename = "UdpBasicApp"
*.branch*.office*.client[*].app[0].destAddresses = "extServer"
*.branch*.office*.client[*].app[0].destPort = 5000
*.branch*.office*.client[*].app[0].messageLength = 1100B
*.branch*.office*.client[*].app[0].sendInterval = 1s
*.branch*.office*.client[*].app[0].startTime = uniform(5s, 7s)
*.branch*.office*.client[*].app[0].stopTime = 95s