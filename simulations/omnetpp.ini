*.branch1.office2.client[*].app[2].connectAddress = "Global.branch1.localServer[0]"
*.branch1.office3.client[*].app[2].connectAddress = "Global.branch1.localServer[1]"
*.branch1.office4.client[*].app[2].connectAddress = "Global.branch1.localServer[1]"

*.branch2.office1.client[*].app[2].connectAddress = "Global.branch2.localServer[0]"
*.branch2.office2.client[*].app[2].connectAddress = "Global.branch2.localServer[0]"
*.branch2.office3.client[*].app[2].connectAddress = "Global.branch2.localServer[1]"
*.branch2.office4.client[*].app[2].connectAddress = "Global.branch2.localServer[1]"

*.branch3.office1.client[*].app[2].connectAddress = "Global.branch3.localServer[0]"
*.branch3.office2.client[*].app[2].connectAddress = "Global.branch3.localServer[0]"
*.branch3.office3.client[*].app[2].connectAddress = "Global.branch3.localServer[1]"
*.branch3.office4.client[*].app[2].connectAddress = "Global.branch3.localServer[1]"


[Config Servers3_TCP_OSPF]
